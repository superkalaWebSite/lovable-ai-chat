    <g transform="rotate(-7 268 470)">
      <rect x="196" y="330" width="148" height="300" rx="26" fill="url(#phoneBody)"/>
      <rect x="206" y="340" width="128" height="280" rx="20" fill="#2b5540"/>
      <rect x="220" y="356" width="62" height="96" rx="22" fill="#1e3d2b"/>

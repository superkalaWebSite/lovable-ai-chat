<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcecdf"/>
      <stop offset="1" stop-color="#c9e1cf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2e8d6"/>
      <stop offset="1" stop-color="#e8f4ea"/>
    </linearGradient>
    <linearGradient id="podium" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c6e4cd"/>
      <stop offset="1" stop-color="#a7d2b2"/>
    </linearGradient>
    <linearGradient id="podiumTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f4e7"/>
      <stop offset="1" stop-color="#cbe8d1"/>
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54936b"/>
      <stop offset="1" stop-color="#2c5c40"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6f50"/>
      <stop offset="1" stop-color="#22442f"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#97c6a5"/>
      <stop offset="1" stop-color="#6ea181"/>
    </linearGradient>
    <linearGradient id="shoeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4543f"/>
      <stop offset="1" stop-color="#bf332a"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#93d5a7"/>
      <stop offset="1" stop-color="#3f9161"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="leafBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- دیوار و کف استودیویی به رنگ سبز روشن (mint) -->
  <rect width="1600" height="900" fill="#d5e9d9"/>
  <rect width="1600" height="640" fill="url(#wall)"/>
  <rect y="612" width="1600" height="288" fill="url(#floor)"/>
  <rect y="600" width="1600" height="26" fill="#9dc4a8" opacity="0.55" filter="url(#leafBlur)"/>

  <!-- سایه برگ‌های نرم روی دیوار (سمت راست، مثل نمونه) -->
  <g filter="url(#leafBlur)">
    <g fill="#ffffff" opacity="0.4">
      <ellipse cx="1420" cy="130" rx="150" ry="46" transform="rotate(-28 1420 130)"/>
      <ellipse cx="1540" cy="300" rx="170" ry="52" transform="rotate(-34 1540 300)"/>
      <ellipse cx="1330" cy="360" rx="120" ry="40" transform="rotate(-24 1330 360)"/>
      <ellipse cx="1480" cy="520" rx="150" ry="44" transform="rotate(-30 1480 520)"/>
      <ellipse cx="1210" cy="90" rx="100" ry="34" transform="rotate(-22 1210 90)"/>
    </g>
    <g fill="#8dbb98" opacity="0.35">
      <ellipse cx="1470" cy="210" rx="130" ry="38" transform="rotate(-30 1470 210)"/>
      <ellipse cx="1300" cy="470" rx="110" ry="34" transform="rotate(-26 1300 470)"/>
      <ellipse cx="1560" cy="80" rx="120" ry="36" transform="rotate(-20 1560 80)"/>

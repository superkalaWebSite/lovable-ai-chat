    <g fill="#b8dabf">
      <rect x="344" y="200" width="16" height="416" rx="8"/>
      <rect x="376" y="176" width="16" height="440" rx="8"/>
      <rect x="408" y="162" width="16" height="454" rx="8"/>
      <rect x="440" y="162" width="16" height="454" rx="8"/>
      <rect x="472" y="176" width="16" height="440" rx="8"/>
      <rect x="504" y="200" width="16" height="416" rx="8"/>
    </g>
    <path d="M330 616 V266 a105 105 0 0 1 210 0 V616 Z" fill="none" stroke="#8bbd99" stroke-width="4"/>
  </g>


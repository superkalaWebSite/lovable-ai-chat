    <rect x="424" y="628" width="56" height="70" rx="20" fill="#5aa075"/>
    <rect x="424" y="764" width="56" height="66" rx="20" fill="#5aa075"/>
    <rect x="398" y="684" width="108" height="104" rx="28" fill="#2b5540"/>
    <rect x="410" y="696" width="84" height="80" rx="20" fill="#10241a"/>

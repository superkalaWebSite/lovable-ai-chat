    <rect x="620" y="222" width="146" height="150" rx="16" fill="url(#machine)"/>
    <rect x="636" y="240" width="114" height="46" rx="10" fill="#26513a"/>
    <circle cx="693" cy="263" r="9" fill="#cde9d3"/>
    <rect x="676" y="300" width="34" height="16" rx="8" fill="#1e4030"/>
    <rect x="636" y="360" width="114" height="74" rx="14" fill="#eaf5ec" opacity="0.9"/>

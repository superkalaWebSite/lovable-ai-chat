    <circle cx="452" cy="736" r="5" fill="#eaf5ec"/>
    <rect x="504" y="716" width="8" height="26" rx="4" fill="#a4cdb0"/>
  </g>

  <!-- برگ‌های ریز پراکنده -->
  <g fill="#3f9161">
    <path d="M580 660 c-30 -10 -46 -38 -42 -70 c32 8 50 36 42 70 z"/>
    <path d="M614 676 c26 -16 34 -48 22 -76 c-28 14 -38 46 -22 76 z" fill="#57a97a"/>
    <path d="M905 700 c-28 -12 -42 -42 -34 -72 c30 10 46 40 34 72 z"/>
  </g>

  <!-- کفش اسپرت قرمز (کانون رنگی، مثل نمونه) -->
  <g>
    <ellipse cx="880" cy="760" rx="210" ry="30" fill="#6f9e7f" opacity="0.45" filter="url(#softShadow)"/>
    <path d="M712 726 c-16 -6 -22 -22 -12 -38 c14 -22 40 -34 78 -38 l246 -24 c46 -4 84 6 112 30 c22 18 30 42 22 62 c-6 16 -24 26 -48 26 l-344 2 c-24 0 -42 -8 -54 -20 z" fill="#f5f5ee"/>
    <path d="M706 716 c-14 -6 -18 -22 -8 -36 l396 -2 c18 14 26 32 22 52 c-4 16 -22 26 -46 26 l-344 2 c-22 0 -38 -8 -48 -18 z" fill="#333b35" opacity="0.85"/>
    <path d="M716 686 c-12 -34 -6 -76 20 -108 c30 -38 84 -58 154 -58 c62 0 126 16 186 46 c42 22 70 50 82 84 c6 18 2 34 -14 42 c-14 8 -34 10 -58 8 l-336 -14 c-22 -1 -40 -4 -34 0 z" fill="url(#shoeRed)"/>
    <path d="M740 574 c34 -34 88 -52 156 -52 c58 0 118 14 172 40 c-52 -12 -110 -18 -170 -16 c-62 2 -114 14 -158 28 z" fill="#f2f2ea" opacity="0.9"/>
    <g stroke="#9e2b23" stroke-width="7" stroke-linecap="round" opacity="0.8">
      <path d="M778 566 l58 66"/>
      <path d="M818 546 l54 68"/>
      <path d="M860 532 l50 70"/>
    </g>
    <path d="M944 560 c46 8 84 30 112 64 c-34 8 -74 10 -120 6 c8 -24 10 -46 8 -70 z" fill="#a52d24" opacity="0.65"/>
    <path d="M712 686 c-10 -22 -8 -50 6 -76 c-4 30 2 56 18 74 c-8 4 -16 4 -24 2 z" fill="#a52d24" opacity="0.7"/>
    <path d="M730 646 c-6 -26 0 -52 16 -74 c-6 44 -2 74 12 96 z" fill="#f5f5ee" opacity="0.85"/>
    <ellipse cx="756" cy="546" rx="34" ry="20" transform="rotate(-32 756 546)" fill="#f5f5ee"/>
    <path d="M1064 640 c18 16 24 36 18 56 l-40 -10 c8 -16 14 -32 22 -46 z" fill="#2f3b33"/>
  </g>

  <!-- نور پراکنده -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="1180" cy="180" r="5"/>
    <circle cx="1340" cy="420" r="4"/>
    <circle cx="1050" cy="120" r="4"/>

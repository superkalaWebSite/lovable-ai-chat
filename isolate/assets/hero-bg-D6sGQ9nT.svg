    <path d="M382 384 v-34 a76 76 0 0 1 152 0 v34" stroke="#a4cdb0" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="352" y="352" width="66" height="124" rx="31" fill="url(#cup)"/>
    <rect x="498" y="352" width="66" height="124" rx="31" fill="url(#cup)"/>

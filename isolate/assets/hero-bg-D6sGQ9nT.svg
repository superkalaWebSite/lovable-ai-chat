    <path d="M52 640 c-18 -46 8 -96 62 -118 c58 -24 132 -18 176 16 c40 32 44 78 20 102 z" fill="#dbd4c5"/>
    <path d="M52 640 c-14 -40 6 -82 52 -102 c40 -18 92 -16 130 4 c-70 6 -132 44 -182 98 z" fill="#c6bdab"/>
    <path d="M150 640 c-10 -34 10 -66 50 -80 c34 -12 78 -10 108 8 c-56 4 -118 30 -158 72 z" fill="#e6e0d4" opacity="0.7"/>
